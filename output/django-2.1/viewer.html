const INDEX = JSON.parse(document.getElementById('index').textContent);
const listEl = document.getElementById('list'), countEl = document.getElementById('count');
const statusEl = document.getElementById('status'), infoEl = document.getElementById('info');
const KIND_COLOR = {METHOD:'#9be29b', METHOD_RETURN:'#f3a3a3', METHOD_PARAMETER_IN:'#c8f0c8',

let current = -1, cy = null, LINES = null, loading = null;

(function(){  // version navigation (output/versions.js, written by `python -m codegraphs index`)
  const sel = document.getElementById('ver');
  const vers = ((window.CODEGRAPHS_INDEX || {})['django'] || []).map(e => e.version);
  if (!vers.includes('2.1')) vers.push('2.1');
  vers.forEach(v => { const o = document.createElement('option'); o.value = o.textContent = v;
    if (v === '2.1') o.selected = true; sel.appendChild(o); });
  sel.onchange = () => { location.href = '../django-' + encodeURIComponent(sel.value) + '/viewer.html'; };
})();

function loadGraphs(){
  if (LINES) return Promise.resolve(LINES);
  if (loading) return loading;
  if (location.protocol === 'file:') {
    statusEl.textContent = 'Graphs cannot be loaded from file:// — open via GitHub Pages or run `python -m codegraphs serve`.';
    return Promise.reject(new Error('file protocol'));

  statusEl.textContent = 'Loading graphs.jsonl.gz …';
  loading = fetch('graphs.jsonl.gz').then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();
    }).then(t => { LINES = t.split('\n'); statusEl.textContent = ''; return LINES; })
    .catch(e => { statusEl.textContent = 'Could not load graphs: ' + e.message; loading = null; throw e; });
  return loading;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mode(){ return document.querySelector('input[name=mode]:checked').value; }

function renderList(filter){
  const terms = filter.toLowerCase().split(/\s+/).filter(Boolean);
  listEl.innerHTML = ''; let n = 0; const frag = document.createDocumentFragment();
  INDEX.forEach((e, i) => {
    const hay = (e[0] + ' ' + e[1]).toLowerCase();
    if (terms.some(t => !hay.includes(t))) return;
    n++;
    const d = document.createElement('div'); d.className = 'item' + (i === current ? ' sel' : '');
    d.innerHTML = '<div class="q">' + esc(e[1]) + '</div><div class="f">' + esc(e[0]) + ':' + e[3] +
      ' &middot; ' + e[5] + ' nodes</div>';
    d.onclick = () => { location.hash = i; };
    frag.appendChild(d);
  });
  listEl.appendChild(frag);
  countEl.textContent = n + ' of ' + INDEX.length + ' functions';
}

function show(i){
  if (!INDEX[i]) return;
  current = i; renderList(document.getElementById('q').value);
  loadGraphs().then(lines => draw(JSON.parse(lines[i]))).catch(() => {});
}

function draw(g){
  const els = [];
  g.nodes.forEach(n => {
    const lab = (n.line != null ? 'L' + n.line + ' ' : '') + n.kind + '\n' + n.text;
    els.push({group:'nodes', data:{id:'n'+n.id, label:lab, color:KIND_COLOR[n.kind] || '#eeeeee',
      tip: n.kind + (n.line != null ? ', line ' + n.line : '') + '   in: ' + n.vars_in.join(', ') +
           '   out: ' + n.vars_out.join(', ')}});
  });
  const m = mode();
  if (m !== 'dfg') g.cfg_edges.forEach((e, k) => els.push({group:'edges', classes:'cfg',
      data:{id:'c'+k, source:'n'+e[0], target:'n'+e[1], label:e[2]}}));
  if (m !== 'cfg') g.dfg_edges.forEach((e, k) => els.push({group:'edges', classes:'dfg',
      data:{id:'d'+k, source:'n'+e[0], target:'n'+e[1], label:e[2]}}));
  const layoutEdges = g.cfg_edges.map((e, k) => ({group:'edges', classes:'layout',
      data:{id:'l'+k, source:'n'+e[0], target:'n'+e[1]}}));
  if (cy) cy.destroy();
  cy = cytoscape({container: document.getElementById('cy'), elements: els.concat(layoutEdges),
    wheelSensitivity: 0.3,
    style: [
      {selector:'node', style:{'shape':'round-rectangle', 'background-color':'data(color)',
        'border-width':1, 'border-color':'#888', 'label':'data(label)', 'text-wrap':'wrap',
        'text-max-width':300, 'font-size':10, 'font-family':'Consolas, monospace',
        'text-valign':'center', 'padding':5,
        'width': n => Math.min(320, 6.2 * Math.max(...n.data('label').split('\n').map(s => s.length)) + 14),
        'height': n => 14 * n.data('label').split('\n').length + 8}},
      {selector:'edge', style:{'curve-style':'bezier', 'target-arrow-shape':'triangle',
        'arrow-scale':0.8, 'width':1.3, 'label':'data(label)', 'font-size':9,
        'text-background-color':'#fff', 'text-background-opacity':0.8}},
      {selector:'edge.cfg', style:{'line-color':'#555', 'target-arrow-color':'#555'}},
      {selector:'edge.dfg', style:{'line-color':'#e67e22', 'target-arrow-color':'#e67e22',
        'line-style':'dashed', 'color':'#b35900'}},
      {selector:'edge.layout', style:{'display':'none'}}
    ]});
  cy.elements('node, edge.layout').layout({name:'dagre', rankDir:'TB', nodeSep:20, rankSep:30}).run();
  cy.fit(undefined, 20);
  const base = g.qualname + ' ' + g.signature + '  (' + g.filepath + ':' + g.line_start + '-' + g.line_end + ')   ' +
    g.nodes.length + ' nodes, ' + g.cfg_edges.length + ' CFG edges, ' + g.dfg_edges.length + ' DDG edges';
  infoEl.textContent = base;
  cy.on('mouseover', 'node', ev => { infoEl.textContent = base + '   |   ' + ev.target.data('tip'); });
  cy.on('mouseout', 'node', () => { infoEl.textContent = base; });
}

document.getElementById('q').addEventListener('input', e => renderList(e.target.value));
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => { if (current >= 0) show(current); });
window.addEventListener('hashchange', () => show(parseInt(location.hash.slice(1))));
renderList('');
if (location.hash) show(parseInt(location.hash.slice(1)));
</script></body></html>
