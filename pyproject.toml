[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraphs"
version = "0.3.0"
description = "Per-function control flow and data dependence graphs from source code (Joern)"
requires-python = ">=3.10,<3.13"   # lib2to3 was removed in 3.13
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
codegraphs = "codegraphs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codegraphs = ["templates/*.html", "joern_scripts/*.sc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
